<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目管理功能 - 产品设计文档</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.8;
    color: #303133;
    background: #f5f7fa;
  }
  .container {
    max-width: 1080px;
    margin: 0 auto;
    background: #fff;
    min-height: 100vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
  }
  .header {
    background: linear-gradient(135deg, #673AB7 0%, #00BCD4 100%);
    color: #fff;
    padding: 50px 40px;
    text-align: center;
  }
  .header h1 { font-size: 30px; margin-bottom: 10px; }
  .header p { font-size: 14px; opacity: 0.9; }
  .content { padding: 40px 50px; }
  .content h2 {
    font-size: 24px;
    color: #1f2329;
    margin: 36px 0 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid #673AB7;
  }
  .content h3 {
    font-size: 19px;
    color: #1f2329;
    margin: 28px 0 14px;
    padding-left: 12px;
    border-left: 4px solid #00BCD4;
  }
  .content h4 {
    font-size: 16px;
    color: #303133;
    margin: 22px 0 10px;
  }
  .content p { margin: 10px 0; color: #4e5969; }
  .content ul, .content ol { margin: 10px 0 10px 24px; color: #4e5969; }
  .content li { margin: 6px 0; }
  .content table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 14px;
    background: #fff;
  }
  .content th, .content td {
    border: 1px solid #e5e6eb;
    padding: 10px 14px;
    text-align: left;
  }
  .content th {
    background: #f7f8fa;
    color: #1f2329;
    font-weight: 600;
  }
  .content tr:hover td { background: #f7f9ff; }
  .content code {
    background: #f2f3f5;
    color: #d63384;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 13px;
    font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
  }
  .content pre {
    background: #1e1e1e;
    color: #d4d4d4;
    padding: 16px 20px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 16px 0;
    font-size: 13px;
    line-height: 1.6;
  }
  .content pre code {
    background: transparent;
    color: inherit;
    padding: 0;
  }
  .content blockquote {
    border-left: 4px solid #ff9500;
    background: #fff7e6;
    padding: 12px 18px;
    margin: 14px 0;
    color: #7a5a00;
  }
  .content strong { color: #1f2329; font-weight: 600; }
  .content a { color: #673AB7; text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .content hr { border: none; border-top: 1px solid #e5e6eb; margin: 30px 0; }
  .content .mermaid {
    text-align: center;
    margin: 20px 0;
    background: #fafafa;
    padding: 16px;
    border-radius: 6px;
  }
  .footer {
    text-align: center;
    padding: 24px;
    color: #86909c;
    font-size: 13px;
    border-top: 1px solid #e5e6eb;
  }
  .loading {
    text-align: center;
    padding: 80px 0;
    color: #86909c;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>项目管理功能 - 产品设计文档</h1>
    <p>民匠有约管理系统 · 项目管理与资金划拨设计方案</p>
  </div>
  <div class="content" id="content">
    <div class="loading">文档加载中...</div>
  </div>
  <div class="footer">
    民匠有约管理系统 · 产品部 · 2026-08-03
  </div>
</div>

<script>
  fetch('./项目管理功能产品设计文档.md')
    .then(r => {
      if (!r.ok) throw new Error('文档未找到: ' + r.status)
      return r.text()
    })
    .then(text => {
      // 先把 mermaid 代码块暂存，避免被 marked 处理
      const mermaidBlocks = []
      text = text.replace(/```mermaid\n([\s\S]*?)```/g, (_, code) => {
        const id = 'mermaid-' + mermaidBlocks.length
        mermaidBlocks.push({ id, code })
        return `<div class="mermaid" id="${id}">${code}</div>`
      })
      document.getElementById('content').innerHTML = marked.parse(text)
      document.title = '项目管理功能 - 产品设计文档'
      // 渲染 mermaid
      if (mermaidBlocks.length) {
        mermaid.initialize({ startOnLoad: false, theme: 'default' })
        mermaidBlocks.forEach(({ id, code }) => {
          const el = document.getElementById(id)
          if (el) {
            mermaid.render(id + '-svg', code).then(({ svg }) => {
              el.innerHTML = svg
            }).catch(() => {})
          }
        })
      }
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        '<p style="color:#ff4d4f">文档加载失败：' + err.message + '</p>' +
        '<p>请确认 <code>项目管理功能产品设计文档.md</code> 已随构建发布。</p>'
    })
</script>
</body>
</html>
